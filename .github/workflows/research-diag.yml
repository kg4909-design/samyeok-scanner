name: research-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in '"AppLovin"' '"Samsung Electronics"'; do
            for mode in TimelineVolRaw TimelineTone; do
              curl -s -m 60 -w '\nHTTP %{http_code} %{time_total}s\n' -G "https://api.gdeltproject.org/api/v2/doc/doc" --data-urlencode "query=$q" --data-urlencode "mode=$mode" --data-urlencode "format=json" --data-urlencode "startdatetime=20220901000000" --data-urlencode "enddatetime=20261113000000" | head -c 700; echo; sleep 6
            done
          done
          python3 -c "import yfinance" 2>/dev/null || pip -q install yfinance
          python3 - <<'PY'
          import time, yfinance as yf
          t=time.time(); print(yf.Ticker('005930.KS').info.get('longName'), round(time.time()-t,1),'s')
          PY
