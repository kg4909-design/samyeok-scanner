# 연구용: DART 연간 재무 수집 (수동 실행만). 6개로 나눠 동시에 받고, 결과는 research-dartfs 브랜치
name: research-dartfs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: timeout 140m python research/dart_fs.py out ${{ matrix.shard }} 6 || true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "fs-${{ matrix.shard }}", path: out/, if-no-files-found: warn }
  save:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: parts, merge-multiple: true }
      - run: |
          mkdir -p res && cp parts/*.json res/ 2>/dev/null || true
          cd res && git init -q -b research-dartfs && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "DART 연간 재무 $(date -u +%F)" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-dartfs
