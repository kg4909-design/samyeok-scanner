# 연구용: DART 연간 재무 수집 (수동 실행만). 결과는 research-dartfs 브랜치
name: research-dartfs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python research/dart_fs.py out
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - run: |
          cd out && git init -q -b research-dartfs && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "DART 연간 재무 $(date -u +%F)" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-dartfs
